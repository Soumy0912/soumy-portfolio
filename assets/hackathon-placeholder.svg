<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="50%" stop-color="#0d0d0f"/>
      <stop offset="100%" stop-color="#1a1a1e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="url(#bgGrad)"/>
  <rect width="800" height="1000" fill="url(#grid)"/>
  <rect x="20" y="20" width="760" height="960" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" rx="16"/>
  
  <!-- Camera / Image Icon -->
  <g transform="translate(400, 440)">
    <circle cx="0" cy="0" r="54" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <path d="M -22 -10 L -14 -10 L -10 -16 L 10 -16 L 14 -10 L 22 -10 C 26 -10 28 -8 28 -4 L 28 18 C 28 22 26 24 22 24 L -22 24 C -26 24 -28 22 -28 18 L -28 -4 C -28 -8 -26 -10 -22 -10 Z" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="7" r="9" fill="none" stroke="#ffffff" stroke-width="2"/>
  </g>
  
  <text x="400" y="550" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="24" font-weight="700" fill="#ffffff" letter-spacing="2">HACKATHON / PROJECT PHOTO</text>
  <text x="400" y="590" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="16" fill="rgba(255,255,255,0.45)" letter-spacing="1">Add your tech events or workspace picture</text>
  <text x="400" y="630" text-anchor="middle" font-family="monospace" font-size="13" fill="rgba(255,255,255,0.3)">Drop your image file in /assets</text>
</svg>